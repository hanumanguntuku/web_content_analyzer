# Web Content Analyzer - Docker Compose Configuration
version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_analyzer_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:8501,http://frontend:8501
    volumes:
      - ./backend:/app
      - backend_cache:/home/app/.cache
    networks:
      - web_analyzer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_analyzer_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - ENVIRONMENT=development
    volumes:
      - ./frontend:/app
      - frontend_cache:/home/app/.cache
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web_analyzer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  web_analyzer_network:
    driver: bridge
    name: web_analyzer_network

volumes:
  backend_cache:
    name: web_analyzer_backend_cache
  frontend_cache:
    name: web_analyzer_frontend_cache
